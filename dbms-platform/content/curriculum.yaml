# ---------------------------------------------------------------------------
# DBMS & MySQL — Integrated Curriculum (single source of truth)
#
# Hierarchy: Course → Module → Chapter → Lesson (labs, exercises and quizzes
# live inside lessons) → Module assessment → Projects.
#
# Each lesson lists:
#   id            unique slug; the lesson body lives in content/lessons/<module>/<id>.md
#   title         display title
#   level         beginner | intermediate | advanced | professional
#   minutes       estimated study time
#   prerequisites lesson ids that should be completed first (soft-gated in the UI)
#   topics        the outline the lesson must cover (used for planned lessons too)
#
# Whether a lesson is authored is derived from the presence of its .md file,
# so this file never goes stale.
# ---------------------------------------------------------------------------
course:
  id: dbms-mysql
  title: Database Systems & MySQL — Theory to Production
  mysqlVersion: "8.4 LTS"
  description: >
    An integrated course where every DBMS concept is taught together with its
    MySQL implementation, its internal working inside InnoDB/the MySQL server,
    and its use in production engineering.

modules:
  # =========================================================================
  - id: m01
    number: 1
    title: DBMS Fundamentals & the Relational Model
    level: beginner
    description: What a DBMS is, why it beats files, the relational model, keys, integrity, relational algebra/calculus, ACID and CAP — each demonstrated in MySQL.
    outcomes:
      - Explain what a DBMS provides over a file system and when that matters.
      - Describe the three-schema architecture and data independence.
      - Identify super, candidate, primary, alternate, composite and foreign keys.
      - Translate relational algebra expressions to SQL and back.
    chapters:
      - id: m01-c1
        title: Data, Databases and DBMS
        lessons:
          - id: m01-data-database-dbms
            title: Data, Databases and the DBMS
            level: beginner
            minutes: 35
            prerequisites: []
            topics: [data vs information, what a database is, what a DBMS does, advantages of a DBMS, limitations and costs of a DBMS, MySQL as a DBMS]
          - id: m01-file-systems-vs-dbms
            title: File Systems vs DBMS
            level: beginner
            minutes: 35
            prerequisites: [m01-data-database-dbms]
            topics: [redundancy and inconsistency, data isolation, integrity problems, atomicity problems, concurrent access anomalies, security, how a DBMS solves each]
          - id: m01-database-landscape
            title: Relational vs Non-Relational Databases, Users and Administrators
            level: beginner
            minutes: 40
            prerequisites: [m01-data-database-dbms]
            topics: [relational databases, key-value, document, wide-column, graph, time-series, choosing a model, database users, DBA roles, data engineers, application developers]
      - id: m01-c2
        title: Architecture and Abstraction
        lessons:
          - id: m01-schemas-three-schema-architecture
            title: Schemas, Instances, Three-Schema Architecture and Data Independence
            level: beginner
            minutes: 40
            prerequisites: [m01-data-database-dbms]
            topics: [schema vs instance, external/conceptual/internal levels, logical data independence, physical data independence, views as external schemas, information_schema]
          - id: m01-database-architectures
            title: Database System Architectures
            level: beginner
            minutes: 30
            prerequisites: [m01-schemas-three-schema-architecture]
            topics: [centralized, client-server, 1/2/3-tier, distributed, cloud-managed databases, where MySQL fits]
      - id: m01-c3
        title: The Relational Model
        lessons:
          - id: m01-relational-model
            title: The Relational Model — Relations, Tuples, Attributes and Domains
            level: beginner
            minutes: 40
            prerequisites: [m01-schemas-three-schema-architecture]
            topics: [relation, tuple, attribute, domain, degree, cardinality, relation properties, NULL in the relational model, mapping to MySQL tables]
          - id: m01-keys
            title: Keys — Super, Candidate, Primary, Alternate, Composite and Foreign
            level: beginner
            minutes: 45
            prerequisites: [m01-relational-model]
            topics: [superkey, candidate key, primary key, alternate key, composite key, foreign key, surrogate vs natural keys, keys in MySQL DDL]
          - id: m01-integrity-constraints
            title: Integrity Constraints — Entity, Referential and Domain Integrity
            level: beginner
            minutes: 45
            prerequisites: [m01-keys]
            topics: [domain constraints, entity integrity, referential integrity, ON DELETE/ON UPDATE actions, CHECK constraints, how InnoDB enforces foreign keys]
      - id: m01-c4
        title: Relational Algebra and Calculus
        lessons:
          - id: m01-relational-algebra-basics
            title: Relational Algebra I — Selection, Projection, Set Operations and Product
            level: beginner
            minutes: 50
            prerequisites: [m01-relational-model]
            topics: [selection, projection, rename, union, difference, intersection, Cartesian product, closure property, SQL equivalents, bag vs set semantics]
          - id: m01-relational-algebra-joins
            title: Relational Algebra II — Joins and Division
            level: intermediate
            minutes: 50
            prerequisites: [m01-relational-algebra-basics]
            topics: [theta join, equi-join, natural join, outer joins, semi-join, anti-join, division, query trees, algebraic equivalences used by optimizers]
          - id: m01-relational-calculus
            title: Relational Calculus and Its Relationship to SQL
            level: intermediate
            minutes: 40
            prerequisites: [m01-relational-algebra-joins]
            topics: [tuple relational calculus, domain relational calculus, quantifiers, safety, relational completeness, EXISTS as an existential quantifier]
      - id: m01-c5
        title: Design and Transactions Preview
        lessons:
          - id: m01-design-process
            title: Conceptual, Logical and Physical Database Design
            level: beginner
            minutes: 30
            prerequisites: [m01-keys]
            topics: [design lifecycle, conceptual model, logical model, physical model, design deliverables, where each module of this course fits]
          - id: m01-acid-transactions
            title: ACID Properties and Transaction Fundamentals
            level: beginner
            minutes: 45
            prerequisites: [m01-integrity-constraints]
            topics: [transaction definition, atomicity, consistency, isolation, durability, transaction states, a bank transfer in MySQL]
          - id: m01-cap-theorem
            title: The CAP Theorem, PACELC and Their Relevance to MySQL
            level: intermediate
            minutes: 35
            prerequisites: [m01-acid-transactions]
            topics: [consistency vs availability under partition, PACELC, asynchronous vs semi-synchronous replication, Group Replication, ACID vs BASE]

  # =========================================================================
  - id: m02
    number: 2
    title: MySQL Fundamentals & Environment
    level: beginner
    description: The MySQL server and tools, SQL language categories, databases and tables, every important data type, NULL semantics, constraints, character sets and storage engines.
    outcomes:
      - Install, configure and connect to MySQL 8.4 using the CLI and Workbench.
      - Create, alter and drop databases and tables safely.
      - Choose correct data types and explain how MySQL stores them.
      - Reason about NULL with three-valued logic.
    chapters:
      - id: m02-c1
        title: Getting Started with MySQL
        lessons:
          - id: m02-what-is-mysql
            title: What Is MySQL? Versions, Editions and Architecture Overview
            level: beginner
            minutes: 30
            prerequisites: [m01-data-database-dbms]
            topics: [MySQL history, Community vs Enterprise, LTS vs Innovation releases, 8.0 vs 8.4 vs 9.x, server layers, storage engine API, forks such as MariaDB and Percona]
          - id: m02-install-connect
            title: Installing, Configuring and Connecting to MySQL
            level: beginner
            minutes: 40
            prerequisites: [m02-what-is-mysql]
            topics: [installation options, Docker, my.cnf option files, system variables, mysql CLI, MySQL Workbench, MySQL Shell, connection parameters, authentication plugins]
          - id: m02-sql-categories
            title: SQL Language Categories — DDL, DML, DQL, DCL and TCL
            level: beginner
            minutes: 25
            prerequisites: [m02-install-connect]
            topics: [DDL, DML, DQL, DCL, TCL, implicit commit, standard SQL vs MySQL dialect]
      - id: m02-c2
        title: Databases and Tables
        lessons:
          - id: m02-databases
            title: Creating and Managing Databases
            level: beginner
            minutes: 25
            prerequisites: [m02-sql-categories]
            topics: [CREATE DATABASE, default charset/collation, USE, SHOW DATABASES, DROP DATABASE, information_schema, data directory layout]
          - id: m02-tables-ddl
            title: Creating, Altering and Dropping Tables
            level: beginner
            minutes: 45
            prerequisites: [m02-databases]
            topics: [CREATE TABLE, column definitions, table options, ALTER TABLE, online DDL algorithms, DROP vs TRUNCATE vs DELETE, RENAME TABLE, SHOW CREATE TABLE]
      - id: m02-c3
        title: Data Types
        lessons:
          - id: m02-numeric-types
            title: Numeric Data Types
            level: beginner
            minutes: 40
            prerequisites: [m02-tables-ddl]
            topics: [TINYINT to BIGINT, UNSIGNED, DECIMAL exact arithmetic, FLOAT/DOUBLE approximation, BIT, BOOLEAN, storage sizes, deprecated display width and ZEROFILL, choosing types]
          - id: m02-string-types
            title: String Data Types
            level: beginner
            minutes: 40
            prerequisites: [m02-tables-ddl]
            topics: [CHAR vs VARCHAR, TEXT family, ENUM, SET, BINARY/VARBINARY, length in characters vs bytes, row size limits, trailing space handling]
          - id: m02-datetime-types
            title: Date and Time Data Types
            level: beginner
            minutes: 40
            prerequisites: [m02-tables-ddl]
            topics: [DATE, TIME, DATETIME, TIMESTAMP, YEAR, fractional seconds, time zones and TIMESTAMP conversion, 2038 problem, automatic initialization]
          - id: m02-json-binary-types
            title: JSON and Binary Data Types
            level: beginner
            minutes: 35
            prerequisites: [m02-string-types]
            topics: [native JSON type and binary storage, JSON validation, BLOB family, storing files vs references, UUID storage as BINARY(16)]
      - id: m02-c4
        title: Column Semantics and Table Properties
        lessons:
          - id: m02-null-three-valued-logic
            title: NULL Values and Three-Valued Logic
            level: beginner
            minutes: 40
            prerequisites: [m02-tables-ddl]
            topics: [meaning of NULL, UNKNOWN truth value, truth tables, IS NULL, null-safe equality, NULL in arithmetic, NULL and constraints]
          - id: m02-defaults-auto-increment
            title: DEFAULT Values and AUTO_INCREMENT
            level: beginner
            minutes: 35
            prerequisites: [m02-tables-ddl]
            topics: [literal and expression defaults, CURRENT_TIMESTAMP defaults, AUTO_INCREMENT behaviour, gaps, persistence since 8.0, innodb_autoinc_lock_mode, LAST_INSERT_ID]
          - id: m02-constraints-mysql
            title: Constraints in MySQL
            level: beginner
            minutes: 40
            prerequisites: [m01-integrity-constraints, m02-tables-ddl]
            topics: [NOT NULL, UNIQUE, PRIMARY KEY, FOREIGN KEY, CHECK (8.0.16+), naming constraints, strict SQL mode, constraint violations and error codes]
          - id: m02-charsets-collations
            title: Character Sets and Collations
            level: beginner
            minutes: 35
            prerequisites: [m02-string-types]
            topics: [utf8mb4 vs utf8mb3, collation rules, case and accent sensitivity, comparison and sorting, collation mismatch errors, index impact]
          - id: m02-storage-engines
            title: Storage Engines
            level: beginner
            minutes: 30
            prerequisites: [m02-tables-ddl]
            topics: [pluggable storage engine architecture, InnoDB, MyISAM, MEMORY, CSV, ARCHIVE, choosing InnoDB, ENGINE clause]

  # =========================================================================
  - id: m03
    number: 3
    title: SQL Fundamentals & Data Manipulation
    level: beginner
    description: Retrieving, filtering, sorting, inserting, updating and deleting data; aggregation; conditional logic; and the built-in function library — with execution behaviour and edge cases.
    outcomes:
      - Write correct SELECT, INSERT, UPDATE and DELETE statements.
      - Aggregate with GROUP BY/HAVING and explain NULL handling in aggregates.
      - Use CASE, COALESCE and type conversion without surprises.
    chapters:
      - id: m03-c1
        title: Retrieving Data
        lessons:
          - id: m03-select-basics
            title: SELECT — Columns, Expressions, Aliases and DISTINCT
            level: beginner
            minutes: 40
            prerequisites: [m02-tables-ddl]
            topics: [SELECT list, expressions, column aliases, table aliases, DISTINCT, SELECT * pitfalls, logical execution order preview]
          - id: m03-where-filtering
            title: Filtering with WHERE — Logical Operators, IN and BETWEEN
            level: beginner
            minutes: 40
            prerequisites: [m03-select-basics, m02-null-three-valued-logic]
            topics: [comparison operators, AND/OR/NOT precedence, IN and NOT IN, BETWEEN inclusivity, filtering dates, NULL in predicates]
          - id: m03-pattern-matching
            title: Pattern Matching with LIKE and REGEXP
            level: beginner
            minutes: 35
            prerequisites: [m03-where-filtering]
            topics: [LIKE wildcards, ESCAPE, collation effects, REGEXP_LIKE, REGEXP_REPLACE, REGEXP_SUBSTR, ICU regex engine, index usage of patterns]
          - id: m03-sorting-pagination
            title: Sorting and Pagination — ORDER BY, LIMIT and OFFSET
            level: beginner
            minutes: 35
            prerequisites: [m03-select-basics]
            topics: [ORDER BY direction, multiple sort keys, NULL ordering, sorting by expression, LIMIT/OFFSET, deterministic ordering, keyset pagination preview]
      - id: m03-c2
        title: Modifying Data
        lessons:
          - id: m03-insert
            title: INSERT — Adding Data
            level: beginner
            minutes: 40
            prerequisites: [m03-select-basics, m02-constraints-mysql]
            topics: [single and multi-row INSERT, INSERT ... SELECT, INSERT IGNORE, ON DUPLICATE KEY UPDATE, REPLACE, row alias syntax (8.0.19+), errors and warnings]
          - id: m03-update-delete
            title: UPDATE and DELETE — Changing and Removing Data Safely
            level: beginner
            minutes: 40
            prerequisites: [m03-where-filtering]
            topics: [UPDATE with WHERE, multi-table UPDATE, DELETE, multi-table DELETE, ORDER BY/LIMIT in DML, safe-updates mode, soft deletes, TRUNCATE comparison]
      - id: m03-c3
        title: Aggregation
        lessons:
          - id: m03-aggregate-functions
            title: Aggregate Functions — COUNT, SUM, AVG, MIN and MAX
            level: beginner
            minutes: 50
            prerequisites: [m03-where-filtering, m02-null-three-valued-logic]
            topics: [COUNT(*) vs COUNT(column) vs COUNT(DISTINCT), SUM/AVG/MIN/MAX, NULL handling in aggregates, empty input behaviour, integer vs decimal averages, conditional aggregation]
          - id: m03-group-by-having
            title: GROUP BY and HAVING
            level: beginner
            minutes: 50
            prerequisites: [m03-aggregate-functions]
            topics: [grouping semantics, ONLY_FULL_GROUP_BY and functional dependence, HAVING vs WHERE, WITH ROLLUP, GROUPING(), grouping by expressions, ANY_VALUE]
      - id: m03-c4
        title: Expressions and Built-in Functions
        lessons:
          - id: m03-conditional-expressions
            title: Conditional Logic — CASE, IF, IFNULL, NULLIF and COALESCE
            level: beginner
            minutes: 40
            prerequisites: [m03-where-filtering]
            topics: [simple vs searched CASE, CASE result types, IF(), IFNULL, NULLIF, COALESCE, conditional aggregation, portability]
          - id: m03-string-functions
            title: String Functions
            level: beginner
            minutes: 35
            prerequisites: [m03-select-basics]
            topics: [CONCAT and CONCAT_WS, SUBSTRING, LEFT/RIGHT, TRIM, REPLACE, LOCATE/INSTR, UPPER/LOWER, LPAD/RPAD, LENGTH vs CHAR_LENGTH, GROUP_CONCAT]
          - id: m03-numeric-functions
            title: Mathematical Functions
            level: beginner
            minutes: 30
            prerequisites: [m03-select-basics, m02-numeric-types]
            topics: [ROUND vs TRUNCATE, CEIL/FLOOR, MOD and %, integer division DIV, ABS, POWER, SQRT, RAND, division by zero behaviour, DECIMAL precision rules]
          - id: m03-date-functions
            title: Date and Time Functions
            level: beginner
            minutes: 40
            prerequisites: [m03-select-basics, m02-datetime-types]
            topics: [NOW vs SYSDATE vs CURRENT_DATE, DATE_ADD/DATE_SUB/INTERVAL, DATEDIFF, TIMESTAMPDIFF, DATE_FORMAT, EXTRACT, LAST_DAY, time zone conversion, sargable date ranges]
          - id: m03-type-conversion
            title: Type Conversion and CAST
            level: beginner
            minutes: 35
            prerequisites: [m03-select-basics]
            topics: [implicit conversion rules, CAST and CONVERT, string-to-number pitfalls, comparison coercion, conversion and index usage, warnings]
          - id: m03-null-handling
            title: NULL Handling in Practice
            level: beginner
            minutes: 40
            prerequisites: [m03-aggregate-functions, m03-conditional-expressions]
            topics: [NULL in WHERE, joins, aggregates, ORDER BY, DISTINCT and GROUP BY, NOT IN trap, null-safe operators, design guidelines for nullable columns]

  # =========================================================================
  - id: m04
    number: 4
    title: Joins & Advanced SQL Querying
    level: intermediate
    description: Joins, subqueries, set operations, CTEs, recursive queries and window functions — plus the difference between logical query order and the physical plan MySQL executes.
    outcomes:
      - Choose the correct join type and predict its output, including NULL-extended rows.
      - Write correlated subqueries, EXISTS/NOT EXISTS and recursive CTEs.
      - Solve analytical problems with window functions.
    chapters:
      - id: m04-c1
        title: Joins
        lessons:
          - id: m04-inner-join
            title: INNER JOIN
            level: intermediate
            minutes: 45
            prerequisites: [m03-select-basics, m01-keys]
            topics: [join predicate, inner join semantics, ON vs USING vs NATURAL, join cardinality and row multiplication, nested-loop and hash join preview]
          - id: m04-outer-joins
            title: Outer Joins — LEFT, RIGHT and FULL Emulation
            level: intermediate
            minutes: 45
            prerequisites: [m04-inner-join]
            topics: [LEFT JOIN, RIGHT JOIN, NULL-extended rows, ON vs WHERE in outer joins, finding missing rows, FULL OUTER JOIN emulation with UNION]
          - id: m04-cross-self-join
            title: CROSS JOIN and SELF JOIN
            level: intermediate
            minutes: 35
            prerequisites: [m04-inner-join]
            topics: [Cartesian product, generating combinations, self join for hierarchies, comparing rows within a table, avoiding duplicate pairs]
          - id: m04-multi-table-joins
            title: Multi-Table Joins and Join Conditions
            level: intermediate
            minutes: 45
            prerequisites: [m04-outer-joins]
            topics: [joining many tables, join order, fan-out traps when aggregating, non-equi joins, STRAIGHT_JOIN, reading join plans]
      - id: m04-c2
        title: Subqueries
        lessons:
          - id: m04-subqueries
            title: Subqueries — Scalar, Row, Table and Derived Tables
            level: intermediate
            minutes: 45
            prerequisites: [m04-inner-join, m03-group-by-having]
            topics: [scalar subqueries, row subqueries, derived tables, LATERAL derived tables (8.0.14+), subqueries in SELECT/FROM/WHERE, optimizer transformations]
          - id: m04-correlated-subqueries
            title: Correlated Subqueries
            level: intermediate
            minutes: 40
            prerequisites: [m04-subqueries]
            topics: [correlation, per-row evaluation semantics, decorrelation by the optimizer, top-N per group, rewriting as joins or window functions]
          - id: m04-exists-in
            title: EXISTS, NOT EXISTS, IN and NOT IN
            level: intermediate
            minutes: 45
            prerequisites: [m04-correlated-subqueries, m03-null-handling]
            topics: [semi-join, anti-join, NOT IN with NULLs, EXISTS vs IN vs JOIN, MySQL semi-join strategies, antijoin optimization]
      - id: m04-c3
        title: Set Operations and CTEs
        lessons:
          - id: m04-set-operations
            title: UNION, UNION ALL, INTERSECT and EXCEPT
            level: intermediate
            minutes: 35
            prerequisites: [m04-subqueries]
            topics: [union compatibility, duplicate elimination cost, UNION ALL, INTERSECT and EXCEPT (8.0.31+), ordering and limiting set results]
          - id: m04-ctes
            title: Common Table Expressions
            level: intermediate
            minutes: 40
            prerequisites: [m04-subqueries]
            topics: [WITH clause, multiple CTEs, readability, materialization vs merging, CTE vs derived table vs view]
          - id: m04-recursive-ctes
            title: Recursive CTEs
            level: intermediate
            minutes: 45
            prerequisites: [m04-ctes, m04-cross-self-join]
            topics: [anchor and recursive members, termination, hierarchies, paths, generating series, cte_max_recursion_depth, cycle detection]
      - id: m04-c4
        title: Window Functions
        lessons:
          - id: m04-window-functions
            title: Window Functions — OVER, PARTITION BY and Frames
            level: intermediate
            minutes: 50
            prerequisites: [m03-group-by-having]
            topics: [window vs aggregate, OVER, PARTITION BY, ORDER BY in windows, ROWS vs RANGE frames, named windows, aggregate window functions]
          - id: m04-ranking-functions
            title: Ranking — ROW_NUMBER, RANK, DENSE_RANK and NTILE
            level: intermediate
            minutes: 40
            prerequisites: [m04-window-functions]
            topics: [ROW_NUMBER, RANK, DENSE_RANK, PERCENT_RANK, CUME_DIST, NTILE, ties, top-N per group, deduplication]
          - id: m04-value-functions
            title: Value Functions — LEAD, LAG, FIRST_VALUE, LAST_VALUE and NTH_VALUE
            level: intermediate
            minutes: 40
            prerequisites: [m04-window-functions]
            topics: [LAG and LEAD, period-over-period change, FIRST_VALUE, LAST_VALUE frame trap, NTH_VALUE, sessionization]
          - id: m04-analytical-queries
            title: Advanced Analytical Queries
            level: advanced
            minutes: 55
            prerequisites: [m04-ranking-functions, m04-value-functions, m04-ctes]
            topics: [running totals, moving averages, gaps and islands, cohort retention, funnel analysis, pivoting, comparing solution strategies]
      - id: m04-c5
        title: How Queries Are Processed
        lessons:
          - id: m04-logical-query-order
            title: Logical Query Processing Order vs the Physical Plan
            level: intermediate
            minutes: 40
            prerequisites: [m04-multi-table-joins, m03-group-by-having]
            topics: [logical clause order, why aliases are not visible in WHERE, physical plan vs logical order, EXPLAIN FORMAT=TREE preview, optimizer rewrites]

  # =========================================================================
  - id: m05
    number: 5
    title: Database Design & ER Modeling
    level: intermediate
    description: From business requirements to a working MySQL schema — entities, attributes, relationships, cardinality, weak entities, EER and mapping ER diagrams to tables.
    outcomes:
      - Elicit requirements and produce an ER diagram.
      - Map ER constructs to relational tables with correct keys and constraints.
      - Choose between natural and surrogate keys with justification.
    chapters:
      - id: m05-c1
        title: Conceptual Modeling
        lessons:
          - id: m05-requirements-gathering
            title: Requirements Gathering for Database Design
            level: intermediate
            minutes: 35
            prerequisites: [m01-design-process]
            topics: [stakeholder interviews, nouns and verbs analysis, business rules, data volume and access patterns, requirements document]
          - id: m05-entities-attributes
            title: Entities and Attributes
            level: intermediate
            minutes: 40
            prerequisites: [m05-requirements-gathering]
            topics: [entity types and sets, simple vs composite, single vs multivalued, derived attributes, key attributes, NULL-able attributes]
          - id: m05-relationships-cardinality
            title: Relationships, Cardinality and Participation
            level: intermediate
            minutes: 45
            prerequisites: [m05-entities-attributes]
            topics: [relationship types, degree, cardinality ratios, total vs partial participation, min-max notation, relationship attributes]
          - id: m05-relationship-patterns
            title: One-to-One, One-to-Many, Many-to-Many and Recursive Relationships
            level: intermediate
            minutes: 45
            prerequisites: [m05-relationships-cardinality]
            topics: [1:1 patterns, 1:N patterns, M:N and junction tables, recursive relationships, ternary relationships]
          - id: m05-weak-entities-eer
            title: Weak Entities and Enhanced ER (Specialization/Generalization)
            level: intermediate
            minutes: 45
            prerequisites: [m05-relationship-patterns]
            topics: [weak entities, identifying relationships, partial keys, specialization, generalization, disjoint/overlapping, total/partial, inheritance mapping strategies]
          - id: m05-er-notation
            title: ER Diagram Notations — Chen, Crow's Foot and UML
            level: intermediate
            minutes: 30
            prerequisites: [m05-relationship-patterns]
            topics: [Chen notation, crow's foot, UML class diagrams, tooling, reading industry diagrams, MySQL Workbench EER diagrams]
      - id: m05-c2
        title: From ER to MySQL
        lessons:
          - id: m05-er-to-relational
            title: Converting ER Diagrams to Relational Schemas
            level: intermediate
            minutes: 50
            prerequisites: [m05-weak-entities-eer]
            topics: [mapping algorithm, strong and weak entities, 1:1/1:N/M:N mapping, multivalued attributes, specialization mapping, generated DDL]
          - id: m05-key-selection
            title: Choosing Primary and Foreign Keys
            level: intermediate
            minutes: 40
            prerequisites: [m05-er-to-relational]
            topics: [natural vs surrogate, AUTO_INCREMENT vs UUID, UUID_TO_BIN with swap flag, composite keys, clustered index implications, FK indexing, ON DELETE policies]
          - id: m05-design-case-study
            title: Case Study — From Business Requirements to a MySQL Schema
            level: intermediate
            minutes: 60
            prerequisites: [m05-key-selection]
            topics: [end-to-end design, requirements, ER diagram, schema, DDL, sample queries, design review checklist]

  # =========================================================================
  - id: m06
    number: 6
    title: Database Normalization
    level: intermediate
    description: Functional dependencies, closures and keys, the normal forms from 1NF to 5NF, decomposition properties and principled denormalization.
    outcomes:
      - Compute attribute closures and candidate keys.
      - Decompose relations into 3NF/BCNF with lossless joins.
      - Decide when denormalization is justified.
    chapters:
      - id: m06-c1
        title: Dependency Theory
        lessons:
          - id: m06-anomalies
            title: Update, Insertion and Deletion Anomalies
            level: intermediate
            minutes: 35
            prerequisites: [m01-keys, m03-update-delete]
            topics: [redundancy, update anomaly, insertion anomaly, deletion anomaly, demonstration in MySQL]
          - id: m06-functional-dependencies
