          - id: m12-observability-capacity
            title: Observability, Production Deployment and Capacity Planning
            level: professional
            minutes: 40
            prerequisites: [m11-monitoring]
            topics: [metrics/logs/traces, SLOs, deployment checklists, growth projections, sizing CPU/memory/storage/IOPS]

  # =========================================================================
  - id: m13
    number: 13
    title: Advanced MySQL & Industry-Oriented Topics
    level: professional
    description: JSON, generated columns, full-text and spatial search, anti-patterns, data warehousing, ETL/ELT, analytical optimization, event-driven systems, distributed databases and technology selection.
    outcomes:
      - Use MySQL's JSON, generated column, full-text and spatial features appropriately.
      - Recognise and fix common database anti-patterns.
      - Compare MySQL with PostgreSQL and other systems for a given workload.
    chapters:
      - id: m13-c1
        title: Advanced MySQL Features
        lessons:
          - id: m13-json
            title: Working with JSON in MySQL
            level: professional
            minutes: 45
            prerequisites: [m02-json-binary-types, m04-ctes]
            topics: [JSON path syntax, JSON_EXTRACT and ->/->>, JSON_TABLE, JSON modification functions, partial updates, indexing JSON, when not to use JSON]
          - id: m13-generated-columns
            title: Generated Columns
            level: professional
            minutes: 35
            prerequisites: [m07-covering-prefix-functional]
            topics: [VIRTUAL vs STORED, indexing generated columns, functional indexes comparison, constraints on expressions]
          - id: m13-full-text-search
            title: Full-Text Search
            level: professional
            minutes: 40
            prerequisites: [m07-why-indexes]
            topics: [FULLTEXT indexes, natural language mode, boolean mode, query expansion, stopwords and minimum token size, ngram parser, dedicated search engines]
          - id: m13-spatial
            title: Spatial Data Fundamentals
            level: professional
            minutes: 35
            prerequisites: [m07-why-indexes]
            topics: [geometry types, SRIDs, ST_ functions, SPATIAL indexes, distance queries]
          - id: m13-anti-patterns
            title: Common Database Anti-Patterns
            level: professional
            minutes: 45
            prerequisites: [m06-denormalization, m07-indexing-mistakes]
            topics: [EAV, polymorphic associations, comma-separated lists, God tables, FLOAT for money, SELECT * in production, ORM-generated N+1]
      - id: m13-c2
        title: Analytics and Data Engineering
        lessons:
          - id: m13-data-warehousing
            title: Data Warehousing Fundamentals
            level: professional
            minutes: 45
            prerequisites: [m12-oltp-olap]
            topics: [star and snowflake schemas, facts and dimensions, slowly changing dimensions, grain, building a small star schema in MySQL]
          - id: m13-etl-elt
            title: ETL and ELT Pipelines
            level: professional
            minutes: 40
            prerequisites: [m13-data-warehousing]
            topics: [extract/transform/load, ELT with SQL, incremental loads, watermarks, CDC, data quality checks]
          - id: m13-analytical-optimization
            title: Analytical Query Optimization
            level: professional
            minutes: 40
            prerequisites: [m13-data-warehousing, m07-optimizing-aggregation-sorting]
            topics: [summary tables, pre-aggregation, partition pruning for analytics, window function cost, columnar alternatives]
          - id: m13-event-driven
            title: Event-Driven Database Considerations
            level: professional
            minutes: 35
            prerequisites: [m10-binary-log, m12-distributed-integrity]
            topics: [binlog-based CDC with Debezium, outbox, event ordering, schema evolution of events]
      - id: m13-c3
        title: The Wider Database Landscape
        lessons:
          - id: m13-distributed-databases
            title: Distributed Database Fundamentals
            level: professional
            minutes: 40
            prerequisites: [m01-cap-theorem, m12-sharding]
            topics: [replication and partitioning together, consensus, distributed transactions and 2PC, NewSQL systems]
          - id: m13-mysql-vs-postgresql
            title: MySQL vs PostgreSQL (and Other Systems)
            level: professional
            minutes: 40
            prerequisites: [m10-innodb-myisam]
            topics: [architecture differences, MVCC implementations, SQL feature differences, extensions, operational differences, transferable vs MySQL-specific skills]
          - id: m13-technology-selection
            title: Database Technology Selection
            level: professional
            minutes: 35
            prerequisites: [m13-mysql-vs-postgresql, m13-distributed-databases]
            topics: [requirements-driven selection, workload fit, operational maturity, cost, team skills, decision records]

