# Sample datasets available in every lab. Generated by generate.py (seeded, deterministic).
shop:
  title: Shop (e-commerce)
  description: An online store - customers, a category hierarchy, products, orders with line items, payments and reviews (calendar year 2024).
  tables:
    customers: 25 customers. phone is NULL for every 5th customer; loyalty_tier is NULL for some. Customers 23-25 have never ordered.
    categories: 10 categories in a hierarchy via parent_id (Electronics > Computers > Laptops ...). Roots have parent_id NULL.
    products: 30 products. category_id is NULL for the gift card. Product 4 is inactive with zero stock; product 13 has zero stock.
    orders: 80 orders in 2024 with status pending/paid/shipped/delivered/cancelled/refunded. shipped_at is NULL until shipped; discount_code is NULL for about half of the orders.
    order_items: 182 line items, composite PK (order_id, product_id). unit_price is the historical price and sometimes differs from products.price.
    payments: 76 payments. Pending orders and some cancelled orders have no payment.
    reviews: 45 reviews (rating 1-5, comment sometimes NULL), only for delivered purchases; at most one per (product, customer).
hr:
  title: HR (employees and departments)
  description: A company with a management hierarchy - useful for self joins, recursive CTEs, ranking and window functions.
  tables:
    locations: 5 office locations.
    departments: 7 departments; Research (70) has no employees.
    jobs: 10 job titles with salary bands (job_id is a natural VARCHAR key).
    employees: 30 employees. manager_id references employees (CEO 100 has NULL). Employee 124 has NULL department_id. Employees 107 and 108 share the same salary (ties). commission_pct is only set for sales jobs.
    salary_history: yearly salary history per employee; the latest row equals employees.salary.
university:
  title: University
  description: Departments, instructors, students, courses with prerequisites, course sections by term, enrollments with grades, and advisors.
  tables:
    departments: 5 academic departments.
    instructors: 12 instructors.
    students: 40 students. Two students have NULL dept_id (undeclared). The newest student has no enrollments.
    courses: 15 courses with natural keys such as 'CS-157A'.
    course_prereqs: prerequisite graph (course_id requires prereq_id) - suitable for recursive CTEs.
    sections: 24 sections across Spring/Fall 2023-2024. One section has NULL instructor_id, one has NULL room.
    enrollments: 146 enrollments. grade is NULL for in-progress (Fall 2024) courses.
    advisors: advisor assignments; every 4th student has no advisor.
bank:
  title: Bank
  description: Branches, customers, accounts and an append-only transaction ledger - designed for transaction, isolation and locking lessons.
  tables:
    branches: 3 branches.
    customers: 15 customers; customer 9 is not KYC-verified.
    accounts: 25 accounts (checking/savings). balance has CHECK (balance >= 0) and equals the latest transactions.balance_after. Account 7 is frozen, account 12 closed. version supports optimistic locking.
    transactions: 166 ledger rows. Transfers appear as a transfer_out/transfer_in pair sharing the same reference.
library:
  title: Library
  description: Books, authors (many-to-many), members, physical copies and loans.
  tables:
    authors: 16 authors; one has written nothing in the catalogue.
    books: 12 books (technology, textbooks, fiction).
    book_authors: M:N junction with author_order.
    members: 20 members; members 19 and 20 have never borrowed.
    copies: physical copies per book with a condition (column name `condition` is a reserved word and must be quoted).
    loans: 52 loans; returned_at is NULL for 7 open loans; some returns are late (returned_at > due_at).
empty:
  title: Empty schema
  description: No tables - for lessons and exercises that build their own tables from scratch.
  tables: {}
